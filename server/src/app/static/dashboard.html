<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hospital Dashboard — Hospital de Blanes</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
.header { background: #1e293b; padding: 1.5rem 2rem; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
.header h1 { font-size: 1.5rem; font-weight: 600; color: #f8fafc; }
.header span { color: #64748b; font-size: 0.875rem; }
.header .refresh-btn { background: #334155; color: #94a3b8; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
.header .refresh-btn:hover { background: #475569; color: #e2e8f0; }
.container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
.kpi-card { background: #1e293b; border-radius: 12px; padding: 1.25rem; border: 1px solid #334155; }
.kpi-card .label { font-size: 0.75rem; color: #64748b; margin-bottom: 0.35rem; text-transform: uppercase; letter-spacing: 0.5px; }
.kpi-card .value { font-size: 2rem; font-weight: 700; }
.kpi-card .value.blue { color: #38bdf8; }
.kpi-card .value.green { color: #34d399; }
.kpi-card .value.pink { color: #f472b6; }
.kpi-card .value.purple { color: #a78bfa; }
.kpi-card .value.orange { color: #fb923c; }
.kpi-card .value.yellow { color: #fbbf24; }
.chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
.chart-card { background: #1e293b; border-radius: 12px; padding: 1.5rem; border: 1px solid #334155; }
.chart-card.full { grid-column: 1 / -1; }
.chart-card h2 { font-size: 0.95rem; font-weight: 500; color: #94a3b8; margin-bottom: 1rem; }
canvas { max-height: 300px; }
.table-wrap { overflow-x: auto; max-height: 350px; overflow-y: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
th { text-align: left; padding: 0.6rem 0.75rem; color: #64748b; font-weight: 500; border-bottom: 1px solid #334155; position: sticky; top: 0; background: #1e293b; }
td { padding: 0.6rem 0.75rem; border-bottom: 1px solid #1e293b; }
tr:hover td { background: #0f172a; }
.badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 9999px; font-size: 0.7rem; font-weight: 500; }
.badge.blue { background: #1e3a5f; color: #60a5fa; }
.badge.green { background: #14533b; color: #34d399; }
.badge.pink { background: #4c1d3b; color: #f472b6; }
.error { background: #7f1d1d; color: #fca5a5; padding: 1rem; border-radius: 8px; text-align: center; margin-bottom: 1rem; }
.loading { text-align: center; padding: 3rem; color: #64748b; }
@keyframes spin { to { transform: rotate(360deg); } }
.spinner { width: 32px; height: 32px; border: 3px solid #334155; border-top-color: #38bdf8; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
</style>
</head>
<body>
<div class="header">
  <div><h1>🏥 Hospital de Blanes <span id="dateLabel"></span></h1></div>
  <button class="refresh-btn" onclick="load()">🔄 Refresh</button>
</div>
<div class="container">
  <div id="loading" class="loading"><div class="spinner"></div>Loading dashboard...</div>
  <div id="content" style="display:none">
    <!-- KPI Cards -->
    <div class="kpi-grid" id="kpiGrid"></div>
    <!-- Charts & Tables -->
    <div class="chart-grid">
      <div class="chart-card full"><h2>Visits by Medical Specialty — Today</h2><canvas id="barChart"></canvas></div>
      <div class="chart-card"><h2>7-Day Visit Trend</h2><canvas id="trendChart"></canvas></div>
      <div class="chart-card"><h2>Top 5 Doctors Today</h2><canvas id="doctorChart"></canvas></div>
      <div class="chart-card"><h2>Specialty Distribution</h2><canvas id="pieChart"></canvas></div>
      <div class="chart-card full"><h2>Detail by Specialty</h2><div class="table-wrap"><table><thead><tr><th>Specialty</th><th>Visits</th><th>%</th></tr></thead><tbody id="detailTable"></tbody></table></div></div>
      <div class="chart-card full"><h2>Active Admissions</h2><div class="table-wrap"><table><thead><tr><th>Patient</th><th>Room</th><th>Floor</th><th>Since</th></tr></thead><tbody id="admissionTable"></tbody></table></div></div>
    </div>
  </div>
</div>
<script>
const API = "/api/dashboard/stats";
const colors = ["#38bdf8","#f472b6","#a78bfa","#34d399","#fbbf24","#f87171","#2dd4bf","#fb923c","#818cf8","#e879f9","#94a3b8","#fda4af","#c084fc","#6ee7b7","#fcd34d","#fdba74"];
let barChart, pieChart, trendChart, doctorChart;

document.getElementById("dateLabel").textContent = new Date().toLocaleDateString("en-GB", { weekday:"long", day:"numeric", month:"long", year:"numeric" });

async function load() {
  try {
    const res = await fetch(API);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    render(data);
  } catch (e) {
    document.getElementById("loading").innerHTML = `<div class="error">Error loading dashboard: ${e.message}</div>`;
  }
}

function render(data) {
  document.getElementById("loading").style.display = "none";
  document.getElementById("content").style.display = "block";

  document.getElementById("kpiGrid").innerHTML = `
    <div class="kpi-card"><div class="label">Visits Today</div><div class="value blue">${data.visits_today}</div></div>
    <div class="kpi-card"><div class="label">Surgeries Today</div><div class="value pink">${data.surgeries_today}</div></div>
    <div class="kpi-card"><div class="label">Active Admissions</div><div class="value orange">${data.active_admissions}</div></div>
    <div class="kpi-card"><div class="label">Total Patients</div><div class="value green">${data.total_patients ?? "—"}</div></div>
    <div class="kpi-card"><div class="label">Medical Staff</div><div class="value purple">${(data.total_doctors ?? 0) + (data.total_nurses ?? 0)}</div></div>
    <div class="kpi-card"><div class="label">Doctors</div><div class="value yellow">${data.total_doctors ?? "—"}</div></div>
  `;

  const labels = data.by_specialty.map(s => s.specialty);
  const counts = data.by_specialty.map(s => s.count);
  const total = data.visits_today || 1;

  if (barChart) barChart.destroy();
  if (pieChart) pieChart.destroy();
  if (trendChart) trendChart.destroy();
  if (doctorChart) doctorChart.destroy();

  barChart = new Chart(document.getElementById("barChart"), {
    type: "bar",
    data: { labels, datasets: [{ label: "Visits", data: counts, backgroundColor: colors.slice(0, labels.length), borderRadius: 6 }] },
    options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true, ticks: { stepSize: 1, color: "#64748b" }, grid: { color: "#1e293b" } },
               x: { ticks: { color: "#94a3b8" }, grid: { display: false } } } }
  });

  pieChart = new Chart(document.getElementById("pieChart"), {
    type: "doughnut",
    data: { labels, datasets: [{ data: counts, backgroundColor: colors.slice(0, labels.length), borderWidth: 0 }] },
    options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: "right", labels: { color: "#94a3b8", padding: 12 } } } }
  });

  if (data.visits_trend && data.visits_trend.length) {
    const trendDates = data.visits_trend.map(d => { const dt = new Date(d.date); return dt.toLocaleDateString("en-GB", { weekday:"short", day:"numeric" }); });
    const trendCounts = data.visits_trend.map(d => d.count);
    trendChart = new Chart(document.getElementById("trendChart"), {
      type: "line",
      data: { labels: trendDates, datasets: [{ label: "Visits", data: trendCounts, borderColor: "#38bdf8", backgroundColor: "rgba(56,189,248,0.1)", fill: true, tension: 0.3, pointBackgroundColor: "#38bdf8" }] },
      options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true, ticks: { stepSize: 1, color: "#64748b" }, grid: { color: "#1e293b" } },
                 x: { ticks: { color: "#94a3b8" }, grid: { display: false } } } }
    });
  }

  if (data.top_doctors && data.top_doctors.length) {
    const docLabels = data.top_doctors.map(d => d.name.length > 20 ? d.name.substring(0,18)+"…" : d.name);
    const docCounts = data.top_doctors.map(d => d.count);
    doctorChart = new Chart(document.getElementById("doctorChart"), {
      type: "bar",
      data: { labels: docLabels, datasets: [{ label: "Visits", data: docCounts, backgroundColor: colors.slice(0, docLabels.length), borderRadius: 6 }] },
      options: { responsive: true, maintainAspectRatio: true, indexAxis: "y", plugins: { legend: { display: false } },
        scales: { x: { beginAtZero: true, ticks: { stepSize: 1, color: "#64748b" }, grid: { color: "#1e293b" } },
                 y: { ticks: { color: "#94a3b8" }, grid: { display: false } } } }
    });
  }

  document.getElementById("detailTable").innerHTML = data.by_specialty.map(s =>
    `<tr><td><span class="badge blue">${s.specialty}</span></td><td>${s.count}</td><td>${(s.count / total * 100).toFixed(1)}%</td></tr>`
  ).join("");

  const admTable = document.getElementById("admissionTable");
  if (data.recent_admissions && data.recent_admissions.length) {
    admTable.innerHTML = data.recent_admissions.map(a =>
      `<tr><td>${a.patient}</td><td><span class="badge green">${a.room}</span></td><td>Floor ${a.floor}</td><td>${a.since}</td></tr>`
    ).join("");
  } else {
    admTable.innerHTML = `<tr><td colspan="4" style="color:#64748b;text-align:center;">No active admissions</td></tr>`;
  }
}

load();
</script>
</body>
</html>
