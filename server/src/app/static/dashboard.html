<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hospital Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
.header { background: #1e293b; padding: 1.5rem 2rem; border-bottom: 1px solid #334155; }
.header h1 { font-size: 1.5rem; font-weight: 600; color: #f8fafc; }
.header span { color: #64748b; font-size: 0.875rem; margin-left: 1rem; }
.container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
.kpi-card { background: #1e293b; border-radius: 12px; padding: 1.5rem; border: 1px solid #334155; }
.kpi-card .label { font-size: 0.875rem; color: #64748b; margin-bottom: 0.5rem; }
.kpi-card .value { font-size: 2.5rem; font-weight: 700; color: #38bdf8; }
.kpi-card .value.visits { color: #38bdf8; }
.chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
.chart-card { background: #1e293b; border-radius: 12px; padding: 1.5rem; border: 1px solid #334155; }
.chart-card.full { grid-column: 1 / -1; }
.chart-card h2 { font-size: 1rem; font-weight: 500; color: #94a3b8; margin-bottom: 1rem; }
canvas { max-height: 350px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
th { text-align: left; padding: 0.75rem 1rem; color: #64748b; font-weight: 500; border-bottom: 1px solid #334155; }
td { padding: 0.75rem 1rem; border-bottom: 1px solid #1e293b; }
tr:hover td { background: #1e293b; }
.badge { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 500; }
.badge.blue { background: #1e3a5f; color: #60a5fa; }
.error { background: #7f1d1d; color: #fca5a5; padding: 1rem; border-radius: 8px; text-align: center; margin-bottom: 1rem; }
.loading { text-align: center; padding: 3rem; color: #64748b; }
@keyframes spin { to { transform: rotate(360deg); } }
.spinner { width: 32px; height: 32px; border: 3px solid #334155; border-top-color: #38bdf8; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
</style>
</head>
<body>
<div class="header">
  <h1>Hospital de Blanes <span id="dateLabel"></span></h1>
</div>
<div class="container">
  <div id="loading" class="loading"><div class="spinner"></div>Loading dashboard...</div>
  <div id="content" style="display:none">
    <div class="kpi-grid" id="kpiGrid"></div>
    <div class="chart-grid">
      <div class="chart-card full"><h2>Visits by Medical Specialty</h2><canvas id="barChart"></canvas></div>
      <div class="chart-card full"><h2>Specialty Distribution</h2><canvas id="pieChart"></canvas></div>
      <div class="chart-card full"><h2>Detail</h2><div class="table-wrap"><table><thead><tr><th>Specialty</th><th>Visits</th><th>%</th></tr></thead><tbody id="detailTable"></tbody></table></div></div>
    </div>
  </div>
</div>
<script>
const API = "/api/dashboard/stats";
const colors = ["#38bdf8","#f472b6","#a78bfa","#34d399","#fbbf24","#f87171","#2dd4bf","#fb923c","#818cf8","#e879f9"];
let barChart, pieChart;

document.getElementById("dateLabel").textContent = new Date().toLocaleDateString("en-GB", { weekday:"long", day:"numeric", month:"long", year:"numeric" });

async function load() {
  try {
    const res = await fetch(API);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    render(data);
  } catch (e) {
    document.getElementById("loading").innerHTML = `<div class="error">Error loading dashboard: ${e.message}</div>`;
  }
}

function render(data) {
  document.getElementById("loading").style.display = "none";
  document.getElementById("content").style.display = "block";

  document.getElementById("kpiGrid").innerHTML = `
    <div class="kpi-card"><div class="label">Total Visits Today</div><div class="value visits">${data.total_visits}</div></div>
    <div class="kpi-card"><div class="label">Medical Specialties</div><div class="value">${data.by_specialty.length}</div></div>
  `;

  const labels = data.by_specialty.map(s => s.specialty);
  const counts = data.by_specialty.map(s => s.count);
  const total = data.total_visits || 1;

  if (barChart) { barChart.destroy(); }
  if (pieChart) { pieChart.destroy(); }

  barChart = new Chart(document.getElementById("barChart"), {
    type: "bar",
    data: { labels, datasets: [{ label: "Visits", data: counts, backgroundColor: colors.slice(0, labels.length), borderRadius: 6 }] },
    options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true, ticks: { stepSize: 1, color: "#64748b" }, grid: { color: "#1e293b" } },
               x: { ticks: { color: "#94a3b8" }, grid: { display: false } } } }
  });

  pieChart = new Chart(document.getElementById("pieChart"), {
    type: "doughnut",
    data: { labels, datasets: [{ data: counts, backgroundColor: colors.slice(0, labels.length), borderWidth: 0 }] },
    options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: "right", labels: { color: "#94a3b8", padding: 12 } } } }
  });

  document.getElementById("detailTable").innerHTML = data.by_specialty.map(s =>
    `<tr><td><span class="badge blue">${s.specialty}</span></td><td>${s.count}</td><td>${(s.count / total * 100).toFixed(1)}%</td></tr>`
  ).join("");
}

load();
setInterval(load, 60000);
</script>
</body>
</html>
