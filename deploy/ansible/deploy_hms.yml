---
- name: Deploy HMS API to primary node
  hosts: primary
  become: yes
  vars:
    repo_url: "https://github.com/yosseferrazik/hospital-management-project.git"
    hms_dir: "/opt/hms"
  tasks:
    - name: Install required system packages
      apt:
        name:
          - git
          - rsync
          - python3-venv
          - build-essential
          - libpq-dev
        state: present
        update_cache: yes

    - name: Create hms system user
      user:
        name: hms
        system: yes
        home: "{{ hms_dir }}"
        shell: /usr/sbin/nologin
        state: present

    - name: Create directory structure
      file:
        path: "{{ item }}"
        state: directory
        owner: hms
        group: hms
        mode: "0755"
      loop:
        - "{{ hms_dir }}/releases"
        - "{{ hms_dir }}/venv"
        - "/var/log/hms"

    - name: Ensure /etc/hms.env exists
      copy:
        src: "../../.env.example"
        dest: "/etc/hms.env"
        owner: root
        group: root
        mode: "0600"
      failed_when: false

    - name: Clone or update repository
      git:
        repo: "{{ repo_url }}"
        dest: "{{ hms_dir }}/repo"
        version: main
        force: yes

    - name: Run deploy script
      command: "bash {{ hms_dir }}/repo/scripts/deploy/deploy.sh --force"
      args:
        chdir: "{{ hms_dir }}/repo"
      register: deploy_result
      changed_when: "'nothing to do' not in deploy_result.stdout"

    - name: Show deploy result
      debug:
        var: deploy_result.stdout_lines


- name: Configure standby PostgreSQL replica
  hosts: standby
  become: yes
  vars:
    primary_ip: "{{ hostvars['primary']['ansible_host'] }}"
  tasks:
    - name: Ensure PostgreSQL 16 is installed
      apt:
        name: postgresql-16
        state: present
        update_cache: yes

    - name: Run standby setup
      command: "PRIMARY_IP={{ primary_ip }} bash scripts/deploy/deploy_standby.sh"
      args:
        chdir: "/opt/hms/current"
      failed_when: false
      ignore_errors: yes
